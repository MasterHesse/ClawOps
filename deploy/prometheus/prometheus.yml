# ClawOps 开发环境 Prometheus 抓取配置
# W3 起追加 testbed 服务（order-service / inventory-service）与 clawops 应用指标
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
