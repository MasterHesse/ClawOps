# ClawOps 开发环境 Nginx（M0 仅健康检查占位；prod 版含 HTTPS 与前端托管，W4 落地）
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 80;
    server_name _;

    location /healthz {
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    location / {
      return 404;
    }
  }
}
